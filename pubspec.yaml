name: shapc_clinic_app
description: Bookkeeping and Patient Management Application for SHAPC.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Structural State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Encrypted Database Abstraction Layer
  drift: ^2.14.1
  sqflite_sqlcipher: ^3.0.0+1
  crypto: ^3.0.3

  # Secure Platform Key Storage (Android Keystore / Windows DPAPI)
  flutter_secure_storage: ^9.0.0
  
  # System utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  path_provider: ^2.1.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.1
  build_runner: ^2.4.8
  flutter_lints: ^6.0.0
